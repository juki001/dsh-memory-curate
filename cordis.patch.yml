# dsh-memory-curate bundle patch.
#
# The plugin does not own the compaction engine and does not disable it. Each
# agent preset mounts its own isolated compaction-basic engine; the plugin
# wraps that preset-scoped instance on `agent/created` (via
# `agentPresets.serviceFor(agent, 'compaction')`) only to add corruption guards
# (protected system head, reversed or detached ranges). Compaction itself stays
# host-owned: pressure, threshold and the retained-tail policy are the host's,
# and memory capture never blocks a compaction.
#
# protectTurns bounds tool-result folding and the seqs recorded as a memory's
# provenance; it no longer gates compaction.
#
# headroomTokens/headroomRatio tune the plugin's own memory-pressure reading;
# softRatio/hardRatio/maxDeferSteps are retained for config compatibility and are
# inert on the compaction path.
- insert:
    - id: memory-curate
      name: dsh-memory-curate
      config:
        protectTurns: 5
        protectToolResults: true
        softRatio: 0.8
        hardRatio: 0.92
        headroomTokens: 0
        headroomRatio: 0.0625
        maxDeferSteps: 3
        captureMode: tool-only
        anchorDetail: 标准
        retrievalMode: bm25
        consolidateMode: suggest
        namespace: default
        defaultVisibility: shared
        singleWriter: true
        decayHalfLifeDays: 90
        embedding: off
        embeddingBaseURL: ''
        embeddingModel: ''
        embeddingApiKeyEnv: ''
        embeddingWeight: 0.5
        storePath: ''
